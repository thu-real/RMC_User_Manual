{% extends "!layout.html" %}

{% block sidebartitle %}
    {{ super() }}
    <div class="language-switcher" style="padding: 10px 0;">
        <span style="font-weight: bold;">Language / 语言:</span>
        <strong style="color: var(--color-sidebar-item-text--active, #000);">中文</strong> | 
        <a href="#" id="switch-to-en" style="text-decoration: underline;">English</a>
    </div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var langSwitcher = document.querySelector('.language-switcher');

    // 使用 MutationObserver 监听 DOM 树的变化，应对 Read the Docs 异步注入菜单的情况
    var observer = new MutationObserver(function(mutations, obs) {
        // 查找 Read the Docs 官方的版本的切换菜单（通常是 .rst-versions 或包含 rst-current-version 的组件）
        var rtdMenu = document.querySelector('.rst-versions') || document.querySelector('.rst-current-version');
        
        if (rtdMenu && langSwitcher) {
            // 检测到 RTD 官方菜单存在，隐藏自定义的语言切换按钮
            langSwitcher.style.display = 'none';
            obs.disconnect(); // 停止监听，释放性能
        }
    });

    // 开始监听整个 body 的子节点变化
    observer.observe(document.body, {
        childList: true,
        subtree: true
    });

    // 默认的跳转逻辑保持不变
    var switchBtn = document.getElementById('switch-to-en');
    if (switchBtn) {
        switchBtn.addEventListener('click', function (e) {
            e.preventDefault();
            var currentPath = window.location.pathname;
            var targetPath = currentPath.replace('/zh-cn/', '/en/').replace('/zh/', '/en/'); // 兼容 zh-cn 和 zh
            var targetUrl = window.location.origin + targetPath;
            
            fetch(targetUrl, { method: 'HEAD' })
            .then(function (response) {
                if (response.ok) {
                    window.location.href = targetUrl;
                } else {
                    redirectToEnHome(currentPath);
                }
            })
            .catch(function () {
                redirectToEnHome(currentPath);
            });
        });
    }

    function redirectToEnHome(currentPath) {
        var basePath = currentPath.match(/.*?(?=\/(zh-cn|zh|en)\/)/)[0];
        window.location.href = basePath + '/en/latest/index.html';
    }
});
</script>
{% endblock %}
